<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Ordering</title>
</head>
    <body>
        <center>
        <marquee behavior="" direction="left"><h1></h1></marquee>
        <a href="login system.html" target="_self">NEXT</a>
        </center>
    </body>
    </html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    border-radius: 25px;
    padding: 40px;
}

h1 {
    text-align: center;
    color: #e74c3c;
    margin-bottom: 30px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.menu-item {
    padding: 20px;
    border-radius: 15px;
    background: #ffe0cc;
    text-align: center;
    cursor: pointer;
}

.out-of-stock {
    opacity: 0.5;
    cursor: not-allowed;
}

.cart-section {
    margin-top: 30px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.grand-total {
    font-size: 1.5em;
    font-weight: bold;
    text-align: right;
    margin-top: 10px;
}

.order-btn {
    width: 100%;
    padding: 15px;
    background: red;
    color: white;
    border: none;
    margin-top: 20px;
    font-size: 1.2em;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
<h1>🍔 Order Food</h1>

<div class="menu-grid" id="menu"></div>

<div class="cart-section">
<h2>🛒 Cart</h2>
<div id="cart"></div>
<div class="grand-total" id="total">Total: ₱0</div>
</div>

<button class="order-btn" onclick="placeOrder()">Place Order</button>

<!-- BACK BUTTON -->
<a href="Ordering system.html" class="back-btn">⬅ BACK TO MAIN MENU</a>

</div>

<script>
const menuItems = [
    { name: "Pepperoni", price: 120, stock: 50 },
    { name: "Hawaiian", price: 80, stock: 50 },
    { name: "Pizza", price: 120, stock: 100 },
    { name: "Soft Drinks", price: 30, stock: 50 },
    { name: "Chicago pizza", price: 120, stock: 50 },
    { name: "Grilled pizza", price: 120, stock: 50 },
];

let cart = [];

function renderMenu() {
    const menuDiv = document.getElementById("menu");
    menuDiv.innerHTML = "";

    menuItems.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "menu-item " + (item.stock === 0 ? "out-of-stock" : "");

        div.innerHTML = `
            <h3>${item.name}</h3>
            <p>₱${item.price}</p>
            <p>Stock: ${item.stock}</p>
        `;

        if (item.stock > 0) {
            div.onclick = () => addToCart(index);
        }

        menuDiv.appendChild(div);
    });
}

function addToCart(index) {
    const item = menuItems[index];

    if (item.stock <= 0) return;

    item.stock--;

    const existing = cart.find(c => c.name === item.name);

    if (existing) {
        existing.qty++;
    } else {
        cart.push({ name: item.name, price: item.price, qty: 1 });
    }

    renderMenu();
    renderCart();
}

function renderCart() {
    const cartDiv = document.getElementById("cart");
    cartDiv.innerHTML = "";

    let total = 0;

    cart.forEach(item => {
        const div = document.createElement("div");
        div.className = "cart-item";

        const subtotal = item.price * item.qty;
        total += subtotal;

        div.innerHTML = `
            <span>${item.name} x${item.qty}</span>
            <span>₱${subtotal}</span>
        `;

        cartDiv.appendChild(div);
    });

    document.getElementById("total").innerText = "Total: ₱" + total;
}

function placeOrder() {
    if (cart.length === 0) {
        alert("Cart is empty!");
        return;
    }

    alert("Order placed successfully!");
    // PROCEED TO PAYMENTMEHTHOD
    href:'payment'
    cart = [];
    renderCart();
}

renderMenu();
</script>

</body>
</html>
