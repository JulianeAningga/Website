<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
</head>
    <body>
        <center>
        <marquee behavior="" direction="left"><h1></h1></marquee>
        <a href="customer.html" target="_self"></a>
        </center>
    </body>
    </html>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff6b6b, #feca57);  
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.login-container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    text-align: center;
    width: 350px;
}
h1 {
    color: #e74c3c; 
    margin-bottom: 30px;
}
input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 1em;
}
.login-btn {
    width: 95%;
    padding: 12px;
    background: linear-gradient(45deg, #3498db, #2980b9); 
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1em;
    cursor: pointer;
    margin-top: 15px;
}
.login-btn:hover {
    background: linear-gradient(45deg, #2980b9, #3498db);
}
.back-btn {
    margin-top: 10px;
    display: block;
    text-decoration: none;
    color: #2ecc71; 
    font-weight: bold;
}
.error-msg {
    color: red;
    margin-top: 10px;
}
</style>
</head>
<body>
<div class="login-container">
    <h1>Admin Login</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="login-btn" onclick="login()">Login</button>
    <a href="orderingsystem.html" class="back-btn">← Back to Main Menu</a>
    <div class="role-btn" id="error"></div >
</div>

<script>
function login() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorDiv = document.getElementById('error');

    if(user === "admin" && pass === "1234") {
        window.location.href = "adminpanel.html";
    } else {
        errorDiv.innerText = "❌ Invalid username or password!";
    }
}
</script>
</body>
</html>
